services:
  mongo:
    image: mongo:7
    container_name: poc-chatbot-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: oneblue_chat
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.10
    container_name: poc-chatbot-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      DEBUG: "0"
    volumes:
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  localstack-init:
    image: localstack/localstack:4.10
    container_name: poc-chatbot-localstack-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_ENDPOINT_URL: http://localstack:4566
    volumes:
      - ".\\docker\\localstack-init.sh:/init/localstack-init.sh:ro"
    entrypoint:
      - /bin/sh
      - -c
      - tr -d '\r' < /init/localstack-init.sh > /tmp/localstack-init.sh && /bin/sh /tmp/localstack-init.sh
